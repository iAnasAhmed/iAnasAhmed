name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` — this project has zero dependencies by design (CLAUDE.md §2).
      - name: Typecheck
        run: npx --yes typescript@6 tsc --noEmit

      - name: Test
        run: node --experimental-strip-types --test "src/**/*.test.ts"

      - name: Build
        run: node scripts/build.mjs
