<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayat Fahiem Cosmetics — Meta Ads Command Centre</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💄</text></svg>">
</head>
<body>
<div class="app">

  <aside class="rail">
    <div class="rail-brand">
      <div class="rail-mark">AF</div>
      <div class="t">
        <b>Ayat Fahiem</b>
        <span id="brandSub">Meta Ads</span>
      </div>
    </div>

    <div class="rail-label">Command centre</div>
    <nav class="rail-nav" role="tablist" id="nav">
      <button class="navitem" role="tab" data-view="pulse" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Pulse
      </button>
      <button class="navitem" role="tab" data-view="mentor" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/></svg>
        Mentor
        <span class="count" id="mentorCount" hidden>0</span>
      </button>
      <button class="navitem" role="tab" data-view="campaigns" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="4" width="3" height="14" rx="1"/></svg>
        Campaigns
      </button>
      <button class="navitem" role="tab" data-view="audiences" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Audiences
      </button>
      <button class="navitem" role="tab" data-view="planner" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>
        Planner
      </button>
      <button class="navitem" role="tab" data-view="research" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Research
      </button>
      <button class="navitem" role="tab" data-view="history" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
        History
      </button>
    </nav>

    <div class="rail-foot">
      <div class="rail-status is-offline" id="railStatus">
        <span class="beacon"></span>
        <span class="txt"><b id="statusTitle">Connecting…</b><span id="statusSub">checking account</span></span>
      </div>
      <div class="rail-actions">
        <button class="btn" id="syncBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          Sync
        </button>
        <button class="btn btn-icon" id="themeBtn" title="Toggle light and dark" aria-label="Toggle light and dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="pagehead">
      <div class="ptitle">
        <h1 id="pageTitle">Pulse</h1>
        <p id="pageSub">Loading the account…</p>
      </div>
      <div class="pactions">
        <div class="segmented" id="rangeCtl" role="group" aria-label="Reporting window">
          <button data-days="7" aria-pressed="false">7 days</button>
          <button data-days="28" aria-pressed="true">28 days</button>
          <button data-days="90" aria-pressed="false">90 days</button>
        </div>
      </div>
    </header>

    <div class="content">
      <div id="notices"></div>
      <section class="view" id="view-pulse"></section>
      <section class="view" id="view-mentor" hidden></section>
      <section class="view" id="view-campaigns" hidden></section>
      <section class="view" id="view-audiences" hidden></section>
      <section class="view" id="view-planner" hidden></section>
      <section class="view" id="view-research" hidden></section>
      <section class="view" id="view-history" hidden></section>
      <p class="foot" id="foot"></p>
    </div>
  </div>

</div>
<script src="/vendor/chart.umd.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
